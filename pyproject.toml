[project]
name = "osu-neu"
version = "0.1.0"
description = "Tiny multi-label beatmap pattern model (osu!standard)"
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "onnx>=1.16", "onnxruntime>=1.18", "numpy>=1.26"]

[project.optional-dependencies]
desktop = ["PySide6==6.10.2"]

[tool.setuptools]
packages = ["osuneu"]

[tool.setuptools.package-data]
osuneu = ["web/*.html", "web/*.js", "web/*.css"]
